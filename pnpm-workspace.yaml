packages:
  - config/*
  - packages/*
  - examples/*

catalogMode: strict

catalogs:
  build:
    # vite 8.3.2 depends on rolldown ~1.2.11, which currently resolves to 1.2.12.
    # Pin the trio there so Astro, Nuxt, and tsdown share one copy.
    "@rolldown/browser": 1.2.12
    rolldown: 1.2.12
    tsdown: ^0.23.0
    typescript: ^6.0.3
    vite: 8.3.2
  docs:
    "@astrojs/markdown-remark": ^7.3.1
    "@astrojs/markdown-satteri": ^0.4.2
    "@astrojs/mdx": ^8.0.2
    "@astrojs/react": ^7.0.0
    "@fontsource/ibm-plex-mono": ^5.2.7
    "@fortawesome/fontawesome-svg-core": ^7.2.0
    "@fortawesome/free-brands-svg-icons": ^7.2.0
    "@fortawesome/free-solid-svg-icons": ^7.2.0
    astro: ^7.3.5
    cssnano: ^8.0.2
    postcss: ^8.5.15
  peers:
    "@rolldown/browser": ^1.1.2
    rolldown: ^1.1.2
    vite: ^8.0.16
  prod:
    csstype: ^3.2.3
  script:
    concurrently: ^10.0.5
    taze: ^19.17.2
  test:
    "@vitest/coverage-v8": ^4.1.11
    vitest: ^4.1.11
  tooling:
    "@biomejs/biome": ^2.5.15
    knip: ^6.39.0
  types:
    "@types/node": ^26.6.4
  utils:
    relizy: ^1.5.0
    vite-bundle-analyzer: ^1.3.8

ignoredBuiltDependencies:
  - esbuild
  - sharp

onlyBuiltDependencies:
  - "@rolldown/browser"
  - relizy
